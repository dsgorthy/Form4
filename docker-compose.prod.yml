# Production overrides: restart policies, Caddy reverse proxy, log rotation
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  api:
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://form4.app}
      - DATABASE_URL=postgresql://host.docker.internal/form4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: unless-stopped
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - api
      - frontend
    logging:
      driver: json-file
      options:
        # 30 MB retained NINETEEN MINUTES of access log (measured 2026-09-28):
        # Caddy logs every request header, so a line is ~1.6 KB, against ~29,000
        # bot requests an hour. That is why the deindexing bug of 2026-09-17
        # could not be dated — the window was gone before anyone looked.
        #
        # 600 MB buys roughly six hours. INSURANCE ONLY: the crawler recorder
        # writes ten-minute slots every ten minutes and is correct at nineteen.
        max-size: "200m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
