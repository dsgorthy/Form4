strategy_name: quality_notrend
display_name: "Form4 Outsized Buys"
alert_prefix: "[QNT]"
# No Alpaca account. execution_mode is alert_only and Alpaca has been
# data-only since 2026-08-12, so this strategy needs no dedicated trading
# credentials — it exists to generate a forward record alongside
# quality_momentum, not to place orders. The "MAX 3 strategies, one Alpaca
# account each" rule in CLAUDE.md is about order-submitting strategies.
alpaca_env_prefix: null
starting_capital: 100000
# ══════════════════════════════════════════════════════════════════════════
# REBUILT 2026-09-25. The old rule was a measured losing book.
#
# Full account, including the design registered before any result was read:
# docs/alist_rebuild_2026-09-25.md
#
# WHAT WAS WRONG. This book gated on `career_grade IN (A+, A)` and nothing
# else. On the only tradeable label (abnormal_*td_from_filing — every other
# abnormal_* column is anchored to trade_date, which nobody can act on), that
# gate orders almost nothing: over 2016-2021, episode-level and
# ticker-clustered, A+/A minus C/D is -0.03 / -0.04 / +0.05 / -0.13 / +0.82 /
# +0.23 pp at 3/5/7/10/21/42 trading days, and A+/A as a standalone gate is
# mean +1.44% at t = +1.43. A gate that barely sorts, sized at 3 x 33%, is how
# the book published -0.9% blended CAGR against SPY 13.4% with a 77% drawdown.
# It lost to SPY by 12 points on 2016-2021 AND 20 points on 2022-2026, so this
# was not bad luck in one regime.
#
# The book's own note (kept below) already said it "should be treated as
# unvalidated until it has a second, independent filter". This is that filter.
#
# WHAT REPLACED IT. Two signals, each screened independently over the train
# window with ticker-clustered standard errors and a Bonferroni threshold of
# |t| > 3.01 for 19 signals:
#
#     above_sma50         +1.26 pp   t = +4.62
#     value_pct_of_adv    +0.92 pp   t = +4.57
#
# and they are additive rather than one setup — mean 21td abnormal by cell:
#
#                        below SMA50   above SMA50
#     bottom third          -0.21%        +0.42%
#     middle third          +0.21%        +1.43%
#     top third             +1.16%        +2.91%      (baseline +0.76%)
#
# SIZING 3 x 33% -> 5 x 20%. The concentration, not the signal, is what made
# the drawdown 77%. Gross stays capped at 100% so the book still cannot lever.
#
# WHAT WAS TRIED AND REJECTED, so nobody re-derives it:
#   - the dip. The 2026-08-27 panel put dip_3mo <= -40% at a +10.60 spread,
#     measured on trade-date-anchored returns. On the tradeable label dip_3mo
#     is +0.33 pp at t = +1.28. It does not replicate.
#   - is_largest_ever as a gate (screen t = +4.10). In the book it is not
#     stable: train folds +25.6 / +47.5 / -9.6 excess, and with the size gate
#     +3.7 / +32.8 / -37.7.
#   - the size gate WITHOUT the trend filter: -19.4 excess on train.
#   - the trend filter WITHOUT the size gate: +7.6 on train and positive in
#     all three folds, but -2.9 on the holdout. Parsimony pointed at it and
#     the holdout rejected it; the registered objective picked the config that
#     survived. That is the whole reason the objective was written down first.
#   - "up short-term, down long-term" (above_sma50 and not above_sma200):
#     339 episodes in six years at t = +0.15. Nothing.
#
# THE VALIDATED RESULT. Train 2016-2021: +13.50 excess, 47.8% daily drawdown,
# 144 trades, positive in all three folds (+30.9 / +6.0 / +5.8). HOLDOUT
# 2022-01-01 onward, read ONCE: blended 21.15% against SPY 11.40%, +9.76
# excess, 37.0% drawdown, 99 trades. Full period: 25.1% against SPY 13.5%,
# +11.7 excess, 47.8% drawdown, 248 trades, +16.1 after a 1% round trip.
# Top ten trades are 102% of P&L, against 167% for Insider Breakout and 216%
# for the book this replaces — less carried by a handful, not more. Positive
# in 9 of 11 years; the two losses are small (2018 -$8.0k, 2022 -$12.4k).
#
# STILL TRUE AND STILL UNCOMFORTABLE:
#   - a 47.8% drawdown is not a holdable product for most people. It is better
#     than the 77% it replaces and comparable to Breakout's 52%, and that is
#     all that can be claimed.
#   - 13 configs were simulated. C2 was selected by an objective registered
#     before any of them ran and validated on a holdout read once, which is the
#     best discipline available, not a guarantee. The honest range is the fold
#     band: +5.8 to +30.9 excess.
#   - a TIGHTER STOP measured better on the train folds (-0.20: +32.3/+5.2/
#     +10.0 with drawdowns 8.6/37.1/44.3; -0.30 similar) but was chosen AFTER
#     seeing results, so it is in-sample and is NOT adopted here. It needs its
#     own out-of-sample read.
#   - 32% of this book's positions are also taken by Insider Breakout (80 of
#     253). Two thirds are its own.
# ══════════════════════════════════════════════════════════════════════════
position_size_pct: 0.20
max_concurrent: 5
filing_lookback_days: 2

execution_mode: alert_only

# WHY THIS EXISTED — AND WHY THE PREMISE BELOW IS FALSIFIED (2026-09-25)
#
# Everything in this block is the original argument for a no-trend book. It is
# kept because it is the record of how the book came to be, and because the
# table in it is exactly the trap: those figures were measured on
# trade-date-anchored returns, which include the move between the transaction
# and the filing — a move nobody can capture, worth +2.05% on average and
# +2.68% for A+/A trades. Re-measured on filing-anchored returns, the trend
# filter is the STRONGEST signal available (+1.26 pp, t = +4.62), not the
# weaker half. The book now requires above_sma50.
#
# quality_momentum is career_grade A+/A AND above_sma50 AND above_sma200.
# A variant sweep through the real simulator (2023-01 .. 2026-08, stop loss,
# trailing stop, concurrency and capital all active, entry timestamp-aware)
# says the trend half of that is the weaker half:
#
#   variant                    n   mean α   med α   win%   total
#   quality_momentum          55    7.21    4.28   69.1    +78%
#   this (no trend filter)   140    8.13    6.48   67.1   +351%
#   grade A+/A/B             145    4.72   -0.67   62.8   +158%
#   no grade filter          202    1.06   -1.86   57.4   +108%
#
# Two things fall out of that table. The grade is load-bearing — remove it and
# median alpha goes negative. The trend filter is not: dropping it gives 2.5x
# the trades at a higher median alpha each.
#
# Decomposing the 140 trades by what they WOULD have scored on the trend test:
#
#   fails the trend test   86 trades   median +12.73%   win 72.1%
#   passes the trend test  44 trades   median  +8.04%   win 68.2%
#   no SMA data available  11 trades   median  +0.50%   win 63.6%
#
# The trades quality_momentum rejects outperform the ones it accepts. That is
# consistent with the trade-model fit, where a >20% one-month drawdown carried
# a positive coefficient, and with the insider literature generally: insiders
# are contrarian buyers, and requiring a stock to sit above both moving
# averages screens out the setup where their information is worth most.
#
# WHAT IS NOT ESTABLISHED
#
# Three and a half years, 140 trades, and 2025 contributes a
# disproportionate share of the total. Eleven variants were tested and this
# is the winner, so the figures above are an upper bound, not an expectation.
# Transaction costs are not modelled anywhere in the simulator; at a 1%
# round-trip the median drops about a point.
#
# It runs in parallel with quality_momentum precisely because a backtest
# cannot settle this. Same signal, one filter removed, forward record.

soft_cap: 10
min_conviction: 1.5
min_conviction_above_soft: 7.0
min_conviction_at_hard: 7.0

filters:
  # WIDENED to A+/A/B on 2026-09-25. The grade's only demonstrable work on
  # tradeable returns is separating C/D from everything above it; A+/A against
  # B is negative at every horizon measured. Holding the A+/A bar cost 85% of
  # the candidates (6,978 graded episodes against 1,366) and bought nothing.
  career_grade: ["A+", "A", "B"]

  # THE SECOND FILTER THIS BOOK ALWAYS NEEDED. Trade value divided by the
  # stock's 20-session average dollar volume — a $100k purchase means something
  # different in a name trading $50k a day than in one trading $50m. PIT by
  # construction: the window ends at the last session that had CLOSED when the
  # filing was accepted, which is why it uses filed_at and not filing_date
  # (27.3% of buys are accepted intraday, so a date-only anchor reads six hours
  # into the future).
  #
  # 0.026 is the decile-7 boundary on the train window, which is where the
  # decile curve turns. Deciles 1-6 average +0.40% at 21td; 7-10 average
  # +1.38%:
  #   0.33  -0.06  0.29  0.60  0.66  0.40 | 1.14  1.22  1.52  1.62
  # Not a knife edge in the signal, though the BOOK is sensitive to it: at 0.11
  # (decile 9) the no-trend variant swung from -19 to +16 excess, which is what
  # a few positions look like. Tightening it is not free.
  min_value_pct_of_adv: 0.026

  # The strongest signal screened, and the reason this book is no longer the
  # "no chart condition" book: that premise is falsified on tradeable returns.
  # above_sma200 is deliberately NOT required — that is Insider Breakout's
  # rule, and requiring both would make this a duplicate of it.
  above_sma50: 1

  exclude_recurring: true
  exclude_tax_sales: true

exit:
  strategy: fixed_hold
  # 42 trading days, matched to quality_momentum so the two differ in exactly
  # one respect. Independently re-derived: a hold sweep through the same
  # simulator put both median alpha and win rate at their maximum at 42td.
  # Mean alpha keeps climbing out to 180td, but by then the median is -10.63%
  # and the win rate 51.4% — two lottery tickets carrying thirty-seven trades.
  hold_days: 42
  stop_loss_pct: -0.50  # Catastrophic backstop only, set 2026-08-20.
    # Measured over 2023-01-03..2026-08-20: nothing this book ever held closed
    # below -50%, so this is byte-identical to no stop in every published
    # figure while still capping a genuine blowup. The -30% it replaces was a
    # module-level override in simulate_strategy_portfolio.py that the live
    # runner never applied; it cost 6.4 CAGR points in-sample and bought no
    # drawdown protection (23.5% max either way).
    # Prior grid search still stands, and is why this is a backstop and not a
    # trading stop: tight stops degraded Sharpe on every sibling book tested.

at_capacity: skip

circuit_breaker_dd_pct: 0.15

guardrails:
  # CAPS SIZED FOR A NOTIONAL BOOK THAT COMPOUNDS — reset 2026-09-21.
  #
  # These were 25_000 / 10_000, written for a $10k live account that no
  # longer exists (Alpaca has been data-only since 2026-08-12). On a $100k
  # alert-only stake a designed position is already $20-33k, so the dollar
  # cap sat below the position the yaml itself asks for and every candidate
  # that passed conviction died at the risk stage; the qty cap did the same
  # to any stock under ~$3. The relative check in framework/risk/guardrails
  # (max_position_pct_of_equity, default 50%) is the one that catches a
  # sizing bug; these absolute values are a backstop a real book would need
  # years to reach.
  min_dollar_amount: 100.0
  max_dollar_amount: 150_000.0
  min_qty: 1
  max_qty: 100_000
  min_price: 0.50
  max_price: 5_000.0
  max_daily_buys: 10
  max_daily_sells: 20
