strategy_name: quality_momentum
display_name: "Form4 Insider Breakout"
alert_prefix: "[QM]"
# Dedicated paper account — reads ALPACA_API_KEY_QUALITY_MOMENTUM / _SECRET_QUALITY_MOMENTUM from .env
alpaca_env_prefix: QUALITY_MOMENTUM
starting_capital: 100000
# POSITION SIZING — 5 x 20%, set 2026-08-20 (was 10 x 10%).
#
# max_concurrent: 10 was doing nothing. This book has never held more than five
# positions, so 5, 8 and 10 slots produce byte-identical books; only
# position_size_pct was ever live. At 10% it left 81% of capital in SPY, which
# made the published return roughly two-thirds index.
#
# Grid searched with a 2025-06 holdout, scored on blended equity (idle cash in
# SPY), ranked on excess-over-SPY per unit of vol:
#
#   10 x 10%  (old)   24% deployed   Sharpe 0.84   dd  5.8%
#    5 x 20%  (new)   47% deployed   Sharpe 1.04   dd  9.0%
#    4 x 25%          53% deployed   Sharpe 0.73   dd 10.5%
#
# 5 x 20% is the peak of the grid. Deliberately NOT chasing the 50% deployment
# target — 4 x 25% clears it and costs 30% of the Sharpe.
#
# Gross cap is 5 x 20% = 100%, so the book still cannot lever.
position_size_pct: 0.20
max_concurrent: 5
filing_lookback_days: 2

# Decision sink: 'paper' | 'live' | 'alert_only'.
# 'alert_only' = push iOS notification (ntfy.sh) when a candidate passes all
# filters + conviction + capacity; do NOT submit any Alpaca order. The
# operator manually decides whether to enter via their own brokerage.
# strategy_portfolio rows are still written with execution_source='alert'
# for dedup, capacity counting, and historical analysis. See cw_runner.py
# execution_mode branch.
execution_mode: alert_only

# Validated thesis: A+/A PIT-graded insiders buying in uptrend
# Signal compounds over time — genuine information advantage in favorable setup
#
# Grid search results (2020-2026):
#   10%/10pos/skip/30d: Sharpe 1.18, CAGR 18.5%, MaxDD 10.1%, 137 trades
#   Sub-period: H1 Sharpe 1.08, H2 Sharpe 1.19 (stable across regimes)
#   Only losing year: 2022 (-4.1% CAGR)
#
# Entry pricing: 5-min bar for market-hours filings, T+1 open for after-hours
# Overlap: ZERO with reversal_dip or 10b5_1_surprise (fully independent)
# Universe: ~50 trades/yr at A+/A filter

soft_cap: 10
min_conviction: 1.5
min_conviction_above_soft: 7.0
min_conviction_at_hard: 7.0

filters:
  # Career Grade (V3 scorer) — career-cumulative track record, stable over
  # long gaps. Replaces pit_grade (Recent Form) here per backtest validation
  # 2026-05-07: V3 +0.93pp annual return, +0.02 Sharpe vs V2.
  career_grade: ["A+", "A"]
  above_sma50: 1
  above_sma200: 1
  exclude_recurring: true
  exclude_tax_sales: true

exit:
  strategy: fixed_hold
  hold_days: 42  # Full backtest (2026-04-09): 42td Sharpe 0.49 (ann 1.20), 68.7% WR, +15.5% mean. Peak at ~60 calendar days.
  stop_loss_pct: -0.50  # Catastrophic backstop only, set 2026-08-20.
    # Measured over 2023-01-03..2026-08-20: nothing this book ever held closed
    # below -50%, so this is byte-identical to no stop in every published
    # figure while still capping a genuine blowup. The -30% it replaces was a
    # module-level override in simulate_strategy_portfolio.py that the live
    # runner never applied; it cost 4.4 CAGR points in-sample and bought no drawdown protection.
    # Prior grid search still stands, and is why this is a backstop and not a
    # trading stop: tight stops degraded Sharpe 25% (1.44 -> 1.08). Quality
    # picks recover from dips.

at_capacity: skip

circuit_breaker_dd_pct: 0.15

# Hard guardrails — last line of defense before order submission. Paper
# defaults are larger than live (paper account is $100k notional, live is
# $10k); a single position should still never exceed $25k or 10k shares
# regardless of sizing math.
guardrails:
  min_dollar_amount: 100.0
  max_dollar_amount: 25_000.0
  min_qty: 1
  max_qty: 10_000
  min_price: 0.50
  max_price: 5_000.0
  max_daily_buys: 10
  max_daily_sells: 20
