name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# One run per branch. Pushing three times in a minute previously started
# three overlapping runs, each of which ends in a self-hosted deploy doing
# `git pull` in the same working copy -- they race over the same checkout.
# In-progress runs are NOT cancelled: cancelling mid-deploy is worse than
# queueing, so a superseded run finishes its deploy before the next starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r api/requirements.txt
          pip install ruff pytest

      # Whole repo, not just api/. These four families are genuine bugs --
      # syntax errors, undefined names, invalid comparisons, f-strings
      # missing placeholders -- not style. Widening the scope on 2026-08-24
      # immediately found three F821s in code the api/-only check had never
      # looked at. archive/ is excluded: it is retained-but-dead by design.
      - name: Lint (ruff — critical errors only, tighten over time)
        run: |
          ruff check api/ pipelines/ framework/ scripts/ config/ \
                     strategies/ tests/ dataplane/ \
                     --select E9,F63,F7,F82 --exclude '**/archive/**'

      # No -x. With it, a single missing package at collection time masks
      # the entire suite: 60 consecutive red runs reported one bs4 ImportError
      # while 1,396 tests were never executed and their state was unknown.
      - name: Test
        run: PYTHONPATH="${{ github.workspace }}" pytest tests/unit -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://form4.app/api/v1
          NEXT_PUBLIC_BASE_URL: https://form4.app
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID: placeholder
          NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID: placeholder
          NEXT_PUBLIC_STRIPE_API_MONTHLY_PRICE_ID: placeholder

  deploy-sandbox:
    name: Deploy to sandbox
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Pull latest and deploy sandbox
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          cd /Users/derekg/trading-framework && git pull origin staging && ./deploy/deploy.sh --env sandbox

  deploy-prod:
    name: Deploy to production
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Pull latest and deploy production
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          cd /Users/derekg/trading-framework && git pull origin main && ./deploy/deploy.sh --env prod
