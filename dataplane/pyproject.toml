[project]
name = "pyrrho-dataplane"
version = "0.1.0"
description = "Pyrrho data plane — modular alt-data ingestion + PIT-correct signal pipelines"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "dagster>=1.13",
    "dagster-postgres>=0.27",
    "dagster-dbt>=0.27",
    "dbt-core>=1.11",
    "dbt-postgres>=1.10",
    # Desk dashboard (Starlette + Jinja2 + uvicorn ship with Dagster but
    # listed explicitly here so dataplane runs standalone too)
    "starlette>=1.0",
    "uvicorn>=0.30",
    "jinja2>=3.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    # Read-only MCP server (Pyrrho data access for Claude Desktop / Code)
    "mcp[cli]>=1.0",
    # congress.trades.raw.v1 scrapes Capitol Trades HTML. Without these the
    # signal imports fine and only fails at materialize time, so a venv
    # rebuild would silently stop congress ingestion. lxml is required
    # explicitly: bs4 raises FeatureNotFound for the "lxml" parser rather
    # than falling back.
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["dataplane*", "dagster_project*", "signals*"]
exclude = ["tests*", "dbt_project*"]

[tool.dagster]
module_name = "dagster_project.definitions"
