# EVERY UNIT OF SCHEDULED WORK ON STUDIO, AND WHERE IT RUNS.
#
# Dagster owns scheduling. launchd is legacy and is being retired. This file is
# the single place that says which is which, and `scripts/check_scheduled_work.py`
# fails if reality disagrees with it.
#
# It exists because on 2026-08-26 nobody could answer "what is still on cron?"
# without SSHing in and reading plists out of four different directories, and
# because the migration stalled for nine days without that being visible
# anywhere.
#
# status:
#   dagster  — runs as a Dagster asset/job. The launchd plist MUST be gone.
#              A loaded plist for one of these means the work RUNS TWICE.
#   pending  — still on launchd, must move. Every one of these is debt.
#   exempt   — deliberately not in Dagster. A `reason` is REQUIRED, and it has
#              to be an argument, not a shrug.
#
# Adding scheduled work? It goes in Dagster and it goes in this file. If you
# think you need a new plist, you almost certainly do not — see the exempt
# reasons below for the only shapes that qualify.

dagster:
  - name: bronze-topup
    schedule: "20 * * * *"
    replaced: []
    note: >
      NEW WORK, never had a plist. Fetches the complete SEC submission for any
      accession in `trades` with no row in bronze.edgar_submission. The work
      list is derived, so it self-heals: new filings, anything the historical
      backfill has not reached, and anything a future bug drops are all the
      same case. Bounded at 2000 per run so it tops up rather than competing
      with the historical backfill for SEC's shared 10 req/s budget.

      Bronze is what makes a refetch unnecessary forever; a filing that
      arrives without one is the single gap that must not persist.

  - name: insider-similarity
    schedule: "0 4 * * 0"
    replaced: []
    note: >
      NEW WORK, NOT A MIGRATION — it never had a plist and by the standing rule
      it never will. Rebuilds insider_similarity, the related-insiders
      neighbour list on /insider/*. Weekly because the inputs are an insider's
      whole filing history and their ticker set: neither moves meaningfully in
      a day, and one new filing cannot reorder a neighbour list. Sunday 04:00
      PT is after Saturday's returns backfill, clear of the weekday ingestion
      window, and on the quietest day — the reload TRUNCATEs and re-inserts
      747k rows in one transaction and the insider page reads that table.

  - name: quality-notrend
    schedule: "*/10 6-13 * * 1-5"
    replaced: [com.openclaw.quality-notrend]
    note: >
      Was a long-lived daemon, which is why it outlasted every other
      migration: Dagster schedules jobs, it does not host a process that
      sleeps. Two things made it convertible without a rewrite. cw_runner
      already had --once, and dedup is DB-backed (used_trade_ids from
      strategy_portfolio, held_tickers from open positions), so a scan is
      idempotent across process boundaries and cannot re-alert on something it
      already alerted on.

      The daemon shape also hid an outage: all three were unloaded 2026-08-26
      for the SEC reload and nobody noticed for SEVEN DAYS, because a daemon
      that is gone looks exactly like a daemon that is idle. A schedule that
      stops firing is visible in Dagster.
  - name: quality-momentum
    schedule: "*/10 6-13 * * 1-5"
    replaced: [com.openclaw.quality-momentum]
  - name: reversal-dip
    schedule: "*/10 6-13 * * 1-5"
    replaced: [com.openclaw.reversal-dip]
  - name: form4_pipeline
    schedule: "30 17 * * 1-5"
    replaced: [daily-prices, backfill-returns, refresh-features, compute-signals]
    note: >
      The derived chain as real edges instead of four crons ordered by the
      clock. On 2026-07-28 prices went stale and all three downstream jobs ran
      anyway on stale input and exited 0 for 18 days. Each asset now asserts
      upstream freshness before computing.
  - name: form4_weekly
    schedule: "0 9 * * 0"
    replaced: [refresh-ticker-metadata]
  - name: form4_alerts
    schedule: "0 7 * * *"
  - name: dbt_marts
    schedule: "0 5 * * * (UTC)"
  - name: daily_signals
    schedule: "04:30 UTC, partitioned"
  - name: insider_filings_shadow
    schedule: "sensor 5min + settle 23:30 weekdays"
    note: >
      Shadow of the launchd insider ingest, measuring parity nightly into
      pyrrho_data_dev.parity_history. It has recorded only_in_b = 0 every day
      since 2026-08-10 — the plane has everything the cron path has — while
      only_in_a runs 4-11%, i.e. the CRON path is the one missing filings.
      That is the same loss found independently against EDGAR on 2026-08-26.

  - name: form4_ops
    schedule: "10 schedules, 12 assets — see assets/form4_ops.py"
    replaced: [enrich-narratives, breaking-signal, trial-emails,
               ceowatcher-reader, monday-paper-monitor, alpaca-reconcile,
               thesis-monitor, post-deploy-audit, daily-summary,
               daily-content, strategy-health, pit-shadow]
    note: >
      Moved 2026-08-26. Orchestration only — each asset shells out to the
      exact command its plist ran, same interpreter and same time.
      framework.observability.wrap is kept on the ten that had it, so
      /admin/pipelines still sees them. Plists retired to ~/retired_plists.

pending:
  # Ordered by what it costs to leave alone.
  - name: insider-fetch
    runs: strategies/insider_catalog/fetch_latest.py
    schedule: "every 5m"
    why_it_matters: >
      The core Form 4 ingestion. Its silent failures lost ~12% of filings for
      five months. The parity gate for moving it has been green since
      2026-08-11 and the cutover simply never happened.
  - name: form4-notifications
    runs: pipelines/notification_scanner.py
    schedule: "every 5m"
    why_it_matters: >
      Found only because check_scheduled_work.py flagged it as unregistered.
      Its plist FILE is com.openclaw.insideredge-notifications.plist while its
      LABEL is com.openclaw.form4-notifications, left over from the old Insider
      Edge naming — so any audit that enumerates plist filenames misses it, and
      mine did. Enumerate `launchctl list`, never the directory.
  - name: strategy-intraday
    schedule: "every 10m"
  - name: refresh-open-position-prices
    schedule: "every 15m"
  - name: rebuild-insider-companies
    schedule: "05:30"
  - name: parity-record
    schedule: "06:30"
    why_it_matters: >
      This is the job that has been writing the evidence of the ingestion loss
      to parity_history every morning since 2026-08-10. Nothing read it. When it
      moves, the threshold check moves with it.
  - name: strategy-simulator
    schedule: "07:00"


# Removed 2026-08-26, not migrated — both fired daily against a script that
# does not exist, and neither has a single row in pipeline_runs.
#
#   paper-reset-phase2     ran /tmp/paper_reset_phase2.py. A one-off migration
#                          script left on a schedule; /tmp was long since
#                          cleared. Fired 06:32 every day into nothing.
#   form4-seed-positions   ran scripts/seed_rebalanced_positions.py, which is
#                          absent from the repo AND from Studio, and untracked
#                          in git. It uses framework.observability.wrap, so
#                          zero rows in pipeline_runs means it never got far
#                          enough to record a start.
#
# Plists in ~/retired_plists/ if anyone ever wants to know what they were.
deleted:
  - name: paper-reset-phase2
    reason: "ran /tmp/paper_reset_phase2.py — file gone, 0 recorded runs"
  - name: form4-seed-positions
    reason: "ran scripts/seed_rebalanced_positions.py — absent and untracked, 0 recorded runs"

exempt:
  - name: dagster-daemon
    reason: >
      This IS the scheduler. You cannot schedule it with itself; something
      outside Dagster has to start and keep Dagster alive.
  - name: dagster-webserver
    reason: >
      Same — the UI process that would display the run. If it were a Dagster
      job, a Dagster outage would take away the only view of the outage.
  - name: form4-uptime
    reason: >
      KeepAlive uptime monitor, 1-minute. Its entire job is to notice that
      production is down, which includes Dagster being down. Inside Dagster it
      would go quiet exactly when it is needed.
  - name: form4-error-tail
    reason: "KeepAlive log tail, not scheduled work. Nothing to schedule."
  - name: heartbeat-probe
    reason: >
      Watches whether the pipeline's heartbeat is advancing. Running the
      watchdog inside the thing it watches is the failure mode it exists to
      catch — see feedback_liveness_is_not_health, where a fresh heartbeat
      proved the loop turned while A-List's runner was dead for five days.
  - name: freshness-probe
    reason: "Same argument as heartbeat-probe: it must survive the plane."
  - name: alert-canary
    reason: >
      End-to-end canary for the alert path. A canary that shares infrastructure
      with the system under test is not a canary.
  - name: candidate-count-probe
    reason: "Same: detects 'the strategies found nothing again', independently."
  - name: pg-backup
    reason: >
      Nightly verified pg_dump of form4, pyrrho_data_dev, pyrrho_prod AND
      dagster_runs, rsynced off-box. It backs up Dagster's own database. A
      backup that depends on the thing it is protecting is not a backup.
  - name: pyrrho-desk
    reason: "A long-lived web server on :3031, not scheduled work."
  - name: position-rules-test
    reason: "KeepAlive process, not a schedule."
  - name: tailorly-tunnel
    reason: "Different project (Tailorly). Out of scope for this plane."
  - name: tailorly-maintain
    reason: "Different project (Tailorly). Out of scope for this plane."
