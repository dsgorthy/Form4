services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://host.docker.internal/form4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker's default soft limit here is 1024, and the API hit it on
    # 2026-10-02: psycopg2 could not read /etc/passwd for want of a descriptor
    # and raised `could not look up local user ID 100: Too many open files`, 28
    # times, while opening ~50 Postgres connections a second under a crawl.
    # Pooling in config.database.get_db is the actual fix for that churn; this
    # is headroom so the next unanticipated burst degrades instead of erroring.
    # The container's hard limit is 524288, so this is well within it.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data:/data/app_data:ro
      - ./pipelines/data:/data/runner:ro
      - ./strategies/cw_strategies/data:/data/cw_strategies:ro
      # Read-only logs mount — powers /admin/diagnostics/jobs endpoint that
      # surfaces last-run + recent activity for every launchd job to the
      # admin dashboard.
      - ./logs:/data/logs:ro
    networks:
      - internal
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_API_MONTHLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_API_MONTHLY_PRICE_ID:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    env_file: .env
    environment:
      - API_URL_INTERNAL=http://api:8000/api/v1
    networks:
      - internal
    expose:
      - "3000"

networks:
  internal:
    driver: bridge
