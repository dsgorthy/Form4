services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://host.docker.internal/form4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker's default soft limit here is 1024, and the API hit it on
    # 2026-10-02: psycopg2 could not read /etc/passwd for want of a descriptor
    # and raised `could not look up local user ID 100: Too many open files`, 28
    # times, while opening ~50 Postgres connections a second under a crawl.
    # Pooling in config.database.get_db is the actual fix for that churn; this
    # is headroom so the next unanticipated burst degrades instead of erroring.
    # The container's hard limit is 524288, so this is well within it.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data:/data/app_data:ro
      - ./pipelines/data:/data/runner:ro
      - ./strategies/cw_strategies/data:/data/cw_strategies:ro
      # Read-only logs mount — powers /admin/diagnostics/jobs endpoint that
      # surfaces last-run + recent activity for every launchd job to the
      # admin dashboard.
      - ./logs:/data/logs:ro
    networks:
      - internal
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_API_MONTHLY_PRICE_ID: ${NEXT_PUBLIC_STRIPE_API_MONTHLY_PRICE_ID:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    env_file: .env
    environment:
      - API_URL_INTERNAL=http://api:8000/api/v1
      # ── HEAP HEADROOM. A MITIGATION, NOT A CURE ─────────────────────────
      #
      # Node defaults this container to a 2,080 MB old-space limit while the
      # container itself has no memory cap and the box has 11.65 GiB free. On
      # 2026-10-02/03 the server died at ~1,870 MB used, SIX times in one
      # hour, and each recycle drops in-flight requests: 349 of 8,851 origin
      # requests returned 502 and p95 on /filing/ reached 3.1 seconds.
      #
      # WHAT THIS DOES NOT DO: fix why the working set is ~1.9 GB. The load is
      # a rotating-proxy scraper at ~37 req/s across 8,000+ distinct IPs per
      # sample — 89% of origin traffic — walking distinct /filing/ and
      # /insider/ URLs, and Next's per-request working set is simply large.
      # Raising the ceiling trades OOM frequency for memory we are not using.
      #
      # Two readings I got wrong on the way here, recorded so nobody repeats
      # them: container RSS is NOT the V8 heap (RSS passed 2.2 GiB while the
      # heap limit was 2,096 MB, which looked like 108% of a limit it was not
      # near), and a GC-cycle count of zero is NOT health — this process
      # logged exactly ONE Mark-Compact and died on it, because V8 had not
      # been forced to collect until it was already too late.
      #
      # The real fix is to stop serving 89% of origin to a scraper that never
      # reuses an IP, which needs a Cloudflare managed challenge on cookieless
      # HTML. Revisit this line when that lands.
      - NODE_OPTIONS=--max-old-space-size=6144
    networks:
      - internal
    expose:
      - "3000"

networks:
  internal:
    driver: bridge
